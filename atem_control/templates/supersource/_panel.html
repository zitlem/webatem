{% comment %} SuperSource panel (local addition). State and methods: ssrcPanel()
   in js/atem_supersource.js. {% endcomment %}
<div class="fixed inset-0 z-[200]" x-show="open" x-cloak @keydown.escape.window="open = false">
    <div class="atem-overlay-backdrop absolute inset-0 pointer-events-auto" @click="open = false"
         x-transition:enter="transition-opacity ease-out duration-200" x-transition:enter-start="opacity-0" x-transition:enter-end="opacity-100"></div>
    <div class="relative h-full flex items-center justify-center p-4 pointer-events-none">
        <div class="lp-sheet pointer-events-auto" @click.stop x-show="open"
             x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0 scale-95" x-transition:enter-end="opacity-100 scale-100">
            <div class="lp-head">
                <h2 class="lp-title"><i class="bi bi-grid-1x2"></i> SuperSource</h2>
                <div class="lp-seg" x-show="count > 1" role="group" aria-label="SuperSource">
                    <template x-for="i in count" :key="i">
                        <button type="button" :aria-pressed="current === i - 1" @click="current = i - 1" x-text="'SSrc ' + i"></button>
                    </template>
                </div>
                <span class="lp-note" x-show="error" x-text="error"></span>
                <button type="button" class="btn btn-sm btn-ghost btn-square ml-auto" @click="open = false" title="Close (Esc)"><i class="bi bi-x-lg"></i></button>
            </div>

            <div class="lp-body lp-ssrc" x-show="ssrc">
                <div class="lp-col">
                    <!-- The program frame, 32 x 18 units; boxes drawn to scale -->
                    <div class="lp-frame" x-ref="frame">
                        <div class="lp-frame-art" x-text="'Art: ' + sourceName(ssrc && ssrc.art ? ssrc.art.fill_source : null)"></div>
                        <template x-for="b in boxes()" :key="'b' + b.box">
                            <div class="lp-box" x-show="b.known && b.enabled"
                                 :class="{ 'lp-box-sel': selected === b.box }"
                                 :style="boxStyle(b)"
                                 @pointerdown="dragStart($event, b, 'move')">
                                <span class="lp-box-label"><b x-text="b.box + 1"></b> <span x-text="sourceName(b.source)"></span></span>
                                <span class="lp-box-handle" @pointerdown.stop="dragStart($event, b, 'size')" title="Drag to resize"></span>
                            </div>
                        </template>
                    </div>
                    <div class="lp-presets">
                        <span class="lp-kicker">Layouts</span>
                        <template x-for="p in presets" :key="p.name">
                            <button type="button" class="btn btn-sm bg-base-300 border-0" @click="applyPreset(p)" x-text="p.name"></button>
                        </template>
                    </div>
                </div>

                <div class="lp-col lp-side">
                    <div class="lp-tabs" role="tablist">
                        <template x-for="b in boxes()" :key="'t' + b.box">
                            <button type="button" role="tab" :aria-selected="selected === b.box" @click="selected = b.box"
                                    :class="{ 'lp-off': !b.enabled }">
                                Box <span x-text="b.box + 1"></span>
                            </button>
                        </template>
                        <button type="button" role="tab" :aria-selected="selected === 'art'" @click="selected = 'art'">Art</button>
                    </div>

                    <template x-if="box()">
                        <div class="lp-fields">
                            <label class="lp-row"><span>On</span>
                                <input type="checkbox" class="toggle toggle-sm" :checked="box().enabled" @change="setBox({ enabled: $event.target.checked })">
                            </label>
                            <label class="lp-row"><span>Source</span>
                                <select class="select select-sm select-bordered" @change="setBox({ source: +$event.target.value })">
                                    <template x-for="s in sources" :key="s.source">
                                        <option :value="s.source" x-text="s.long || s.short" :selected="s.source === box().source"></option>
                                    </template>
                                </select>
                            </label>
                            <template x-for="f in boxSliders" :key="f.key">
                                <label class="lp-row" x-show="!f.crop || box().masked"><span x-text="f.label"></span>
                                    <input type="range" class="range range-xs" :min="f.min" :max="f.max" :step="f.step"
                                           :value="box()[f.key]" @input="slide(f.key, +$event.target.value)" @change="slideEnd(f.key, +$event.target.value)">
                                    <output class="brand-data" x-text="(box()[f.key] / f.div).toFixed(f.dp)"></output>
                                </label>
                            </template>
                            <label class="lp-row"><span>Crop</span>
                                <input type="checkbox" class="toggle toggle-sm" :checked="box().masked" @change="setBox({ masked: $event.target.checked })">
                            </label>
                            <button type="button" class="btn btn-xs btn-ghost self-end" x-show="box().masked"
                                    @click="setBox({ top: 0, bottom: 0, left: 0, right: 0 })">Reset crop</button>
                        </div>
                    </template>

                    <template x-if="selected === 'art' && ssrc && ssrc.art">
                        <div class="lp-fields">
                            <label class="lp-row"><span>Fill</span>
                                <select class="select select-sm select-bordered" @change="setArt({ fill_source: +$event.target.value })">
                                    <template x-for="s in sources" :key="s.source">
                                        <option :value="s.source" x-text="s.long || s.short" :selected="s.source === ssrc.art.fill_source"></option>
                                    </template>
                                </select>
                            </label>
                            <label class="lp-row"><span>Key</span>
                                <select class="select select-sm select-bordered" @change="setArt({ key_source: +$event.target.value })">
                                    <template x-for="s in sources" :key="s.source">
                                        <option :value="s.source" x-text="s.long || s.short" :selected="s.source === ssrc.art.key_source"></option>
                                    </template>
                                </select>
                            </label>
                            <div class="lp-row"><span>Art is</span>
                                <div class="lp-seg">
                                    <button type="button" :aria-pressed="ssrc.art.layer === 0" @click="setArt({ layer: 0 })">Background</button>
                                    <button type="button" :aria-pressed="ssrc.art.layer === 1" @click="setArt({ layer: 1 })">Foreground</button>
                                </div>
                            </div>
                            <template x-if="ssrc.art.layer === 1">
                                <div class="lp-fields">
                                    <label class="lp-row"><span>Pre-multiplied</span>
                                        <input type="checkbox" class="toggle toggle-sm" :checked="ssrc.art.premultiplied" @change="setArt({ premultiplied: $event.target.checked })">
                                    </label>
                                    <template x-for="f in artSliders" :key="f.key">
                                        <label class="lp-row" x-show="!ssrc.art.premultiplied"><span x-text="f.label"></span>
                                            <input type="range" class="range range-xs" min="0" max="1000" step="1" :value="ssrc.art[f.key]"
                                                   @input="slideArt(f.key, +$event.target.value)" @change="slideArtEnd(f.key, +$event.target.value)">
                                            <output class="brand-data" x-text="(ssrc.art[f.key] / 10).toFixed(1) + '%'"></output>
                                        </label>
                                    </template>
                                    <label class="lp-row" x-show="!ssrc.art.premultiplied"><span>Invert key</span>
                                        <input type="checkbox" class="toggle toggle-sm" :checked="ssrc.art.invert" @change="setArt({ invert: $event.target.checked })">
                                    </label>
                                </div>
                            </template>
                        </div>
                    </template>
                    <p class="lp-foot">Border settings are not available in this version.</p>
                </div>
            </div>
        </div>
    </div>
</div>
